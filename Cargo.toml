[package]
name = "zephyrus-g14-fn-nav"
version = "0.1.0"
edition = "2021"

[dependencies]
hidapi = "2.6"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
