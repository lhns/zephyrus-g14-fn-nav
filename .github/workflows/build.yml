name: build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Compute version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-${GITHUB_SHA:0:7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Upload exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: zephyrus-g14-fn-nav-${{ steps.version.outputs.VERSION }}-x86_64
          path: target/release/zephyrus-g14-fn-nav.exe
          if-no-files-found: error

      - name: Package self-extracting installer
        shell: bash
        run: |
          python scripts/package.py \
            --exe target/release/zephyrus-g14-fn-nav.exe \
            --version "${{ steps.version.outputs.VERSION }}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: zephyrus-g14-fn-nav-installer-${{ steps.version.outputs.VERSION }}
          path: install-zephyrus-g14-fn-nav-*.bat
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: install-zephyrus-g14-fn-nav-*.bat
